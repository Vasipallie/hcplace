<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Global Canvas</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 30px;
        }

        h1 {
            margin: 0 0 10px 0;
        }

        #status {
            margin-bottom: 20px;
            color: #aaa;
        }

        #canvas-container {
            width: min(800px, 90vw);
            aspect-ratio: 800 / 480;

            background: white;

            border: 2px solid #444;

            overflow: hidden;
        }

        #canvas {
            width: 100%;
            height: 100%;

            display: block;

            image-rendering: pixelated;

            cursor: crosshair;
        }

        #controls {

            width: min(800px, 90vw);

            margin-top: 20px;

            display: flex;
            flex-wrap: wrap;

            gap: 10px;

            justify-content: center;
        }

        .color {

            width: 40px;
            height: 40px;

            border: 3px solid transparent;

            border-radius: 6px;

            cursor: pointer;

            transition: 0.1s;
        }

        .color:hover {
            transform: scale(1.1);
        }

        .color.selected {
            border-color: white;
        }

        #cooldown {

            margin-top: 15px;

            color: #aaa;

            height: 20px;
        }

    </style>

</head>

<body>

    <h1>GLOBAL CANVAS</h1>

    <div id="status">
        Connecting...
    </div>

    <div id="canvas-container">

        <canvas
            id="canvas"
            width="800"
            height="480"
        ></canvas>

    </div>

    <div id="controls"></div>

    <div id="cooldown"></div>

    <script src="/socket.io/socket.io.js"></script>

    <script>

        // ==================================
        // CONFIG
        // ==================================

        const GRID_WIDTH = 80;
        const GRID_HEIGHT = 48;

        const SCREEN_WIDTH = 800;
        const SCREEN_HEIGHT = 480;

        const PIXEL_SIZE = 10;

        // ==================================
        // SOCKET
        // ==================================

        const socket = io();

        // ==================================
        // CANVAS
        // ==================================

        const canvas = document.getElementById("canvas");

        const ctx = canvas.getContext("2d");

        // Prevent blurry pixels
        ctx.imageSmoothingEnabled = false;

        // ==================================
        // UI
        // ==================================

        const status =
            document.getElementById("status");

        const controls =
            document.getElementById("controls");

        const cooldown =
            document.getElementById("cooldown");

        // ==================================
        // COLORS
        // ==================================

        const COLORS = [

            "#000000",
            "#ffffff",

            "#ff0000",
            "#00ff00",
            "#0000ff",

            "#ffff00",
            "#ff00ff",
            "#00ffff",

            "#808080",
            "#800000",
            "#008000",
            "#000080",
            "#808000",
            "#800080",
            "#008080",

            "#ff8000",
            "#ff0080",
            "#8000ff",
            "#00ff80",
            "#0080ff",
            "#80ff00"

        ];

        let selectedColor = "#ff0000";

        // ==================================
        // CREATE COLOR BUTTONS
        // ==================================

        COLORS.forEach((color) => {

            const button =
                document.createElement("button");

            button.className = "color";

            button.style.backgroundColor = color;

            button.dataset.color = color;

            button.addEventListener("click", () => {

                selectedColor = color;

                document
                    .querySelectorAll(".color")
                    .forEach((element) => {
                        element.classList.remove("selected");
                    });

                button.classList.add("selected");

            });

            controls.appendChild(button);

        });

        // Select red initially

        document
            .querySelector('[data-color="#ff0000"]')
            .classList.add("selected");

        // ==================================
        // DRAW PIXEL
        // ==================================

        function drawPixel(x, y, color) {

            ctx.fillStyle = color;

            ctx.fillRect(
                x * PIXEL_SIZE,
                y * PIXEL_SIZE,
                PIXEL_SIZE,
                PIXEL_SIZE
            );

        }

        // ==================================
        // DRAW ENTIRE CANVAS
        // ==================================

        function drawCanvas(data) {

            for (let y = 0; y < GRID_HEIGHT; y++) {

                for (let x = 0; x < GRID_WIDTH; x++) {

                    drawPixel(
                        x,
                        y,
                        data[y][x]
                    );

                }

            }

        }

        // ==================================
        // CONNECTION
        // ==================================

        socket.on("connect", () => {

            status.textContent =
                "Connected";

        });

        socket.on("disconnect", () => {

            status.textContent =
                "Disconnected";

        });

        // ==================================
        // INITIAL CANVAS
        // ==================================

        socket.on(
            "initialCanvas",
            (data) => {

                drawCanvas(data.data);

            }
        );

        // ==================================
        // PIXEL UPDATE
        // ==================================

        socket.on(
            "pixelPlaced",
            (data) => {

                drawPixel(
                    data.x,
                    data.y,
                    data.color
                );

            }
        );

        // ==================================
        // USER COUNT
        // ==================================

        socket.on(
            "userCount",
            (count) => {

                status.textContent =
                    `Connected • ${count} users online`;

            }
        );

        // ==================================
        // PLACE PIXEL
        // ==================================

        canvas.addEventListener(
            "click",
            (event) => {

                // Get actual canvas position
                const rect =
                    canvas.getBoundingClientRect();

                // Account for CSS scaling
                const scaleX =
                    SCREEN_WIDTH / rect.width;

                const scaleY =
                    SCREEN_HEIGHT / rect.height;

                const canvasX =
                    (event.clientX - rect.left) * scaleX;

                const canvasY =
                    (event.clientY - rect.top) * scaleY;

                // Convert to logical grid
                const x =
                    Math.floor(
                        canvasX / PIXEL_SIZE
                    );

                const y =
                    Math.floor(
                        canvasY / PIXEL_SIZE
                    );

                // Send to server
                socket.emit(
                    "placePixel",
                    {
                        x,
                        y,
                        color: selectedColor
                    }
                );

            }
        );

        // ==================================
        // COOLDOWN MESSAGE
        // ==================================

        socket.on(
            "placementRejected",
            (data) => {

                if (data.reason !== "cooldown") {
                    return;
                }

                let remaining =
                    data.remaining;

                function updateCooldown() {

                    if (remaining <= 0) {

                        cooldown.textContent = "";

                        return;
                    }

                    cooldown.textContent =
                        `Wait ${Math.ceil(
                            remaining / 1000
                        )}s`;

                    remaining -= 100;

                    setTimeout(
                        updateCooldown,
                        100
                    );

                }

                updateCooldown();

            }
        );

    </script>

</body>

</html>
